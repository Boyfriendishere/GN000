<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodnight 貴族計算</title>
    <style>
        :root { --gn-pink: #ff4d6d; --gn-dark: #121212; }
        body { font-family: sans-serif; background: var(--gn-dark); color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e1e1e; width: 100%; max-width: 480px; padding: 25px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--gn-pink); text-align: center; font-size: 1.5rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #888; font-size: 0.9rem; }
        select, input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1.1rem; box-sizing: border-box; }
        .current-rank-tag { margin-top: 5px; font-size: 0.9rem; color: #ffd700; font-weight: bold; }
        button { width: 100%; background: var(--gn-pink); color: white; border: none; padding: 18px; border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3); }
        .result-box { background: rgba(255, 77, 109, 0.1); border: 1px dashed var(--gn-pink); padding: 20px; border-radius: 15px; margin-top: 25px; display: none; }
        .res-highlight { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #444; }
        .big-num { color: #ffd700; font-size: 2rem; font-weight: bold; display: block; margin-top: 5px; }
        .res-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1rem; color: #ccc; }
        .res-val { color: white; font-weight: bold; }
        .note { font-size: 0.75rem; color: #666; margin-top: 25px; line-height: 1.6; text-align: center; }
        .thanks { color: var(--gn-pink); font-weight: bold; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Goodnight 貴族計算</h1>

        <div class="input-group">
            <label>1. 本月累積讚數</label>
            <input type="number" id="currZan" value="0" oninput="updateRank()" onclick="this.select()">
            <div id="rankDisplay" class="current-rank-tag">目前等級：</div>
        </div>

        <div class="input-group">
            <label>2. 目標爵位</label>
            <select id="targetRank">
                <option value="25500">劍客 (25,500)</option>
                <option value="175500">騎士 (175,500)</option>
                <option value="425500">伯爵 (425,500)</option>
                <option value="2425500">公爵 (2,425,500)</option>
                <option value="5000000">教皇 (5,000,000)</option>
                <option value="10000000">至尊 (10,000,000)</option>
                <option value="20000000" selected>神王 (20,000,000)</option>
            </select>
        </div>

        <div class="input-group">
            <label>3. 活動加倍 (無加倍讚請填1)</label>
            <input type="number" id="multi" value="30">
        </div>

        <button onclick="doCalc()">立即試算</button>

        <div id="resBoard" class="result-box">
            <div class="res-highlight">
                <span style="font-size: 1.1rem;">🔥 建議刷入</span>
                <span class="big-num"><span id="outGift">0</span> 顆 9999</span>
            </div>
            
            <div class="res-item"><span>預估台幣成本：</span><span class="res-val" id="outCash" style="color:#ffd700;">$0</span></div>
            <div class="res-item"><span>尚差讚數：</span><span class="res-val" id="outDiff">0</span></div>
            <div class="res-item"><span>總需罐頭：</span><span class="res-val" id="outCan">0</span></div>
        </div>

        <div class="note">
            策略建議：<span style="color:#ffd700">升級優於續等</span> (跨月保留等級)<br>
            實戰效率：一顆 9999 罐禮物 = 27,497 讚<br>
            實戰匯率：$1 台幣 ≈ 2 罐頭 (資深玩家提供)<br>
            <span style="color:#aaa;">我男朋友來了 製作 | 2026.03.30</span>
            <div class="thanks">感謝 甜甜小學 分享心得</div>
        </div>
    </div>

    <script>
        const ranks = [
            {name: "神王", val: 20000000}, {name: "至尊", val: 10000000},
            {name: "教皇", val: 5000000}, {name: "公爵", val: 2425500},
            {name: "伯爵", val: 425500}, {name: "騎士", val: 175500},
            {name: "劍客", val: 25500}
        ];

        function updateRank() {
            const val = parseFloat(document.getElementById('currZan').value) || 0;
            let name = "一般用戶";
            for (let r of ranks) { if (val >= r.val) { name = r.name; break; } }
            document.getElementById('rankDisplay').innerText = "目前等級：" + name;
        }

        function doCalc() {
            const curr = parseFloat(document.getElementById('currZan').value) || 0;
            const target = parseFloat(document.getElementById('targetRank').value);
            const multi = parseFloat(document.getElementById('multi').value) || 1;
            
            // 根據提供數據校對：1倍時，一顆 9999罐 = 27,497 讚
            const giftCan = 9999;
            const zanPerGiftAtOne = 27497;
            const exchangeRate = 0.5; // 罐頭/2 = 台幣

            let diff = target - curr;
            if (diff < 0) diff = 0;

            // 1. 算出當前倍數下，一顆 9999 產出多少讚
            const currentZanPerGift = zanPerGiftAtOne * multi;

            // 2. 算出需要幾顆 9999 (取小數點一位供參考)
            const giftNumExact = diff / currentZanPerGift;
            const giftNumDisplay = giftNumExact.toFixed(1);

            // 3. 算出總罐頭 (以剛好達標的顆數計算)
            const totalCan = Math.ceil(giftNumExact * giftCan);
            
            // 4. 算出總台幣
            const cash = Math.ceil(totalCan * exchangeRate);

            document.getElementById('outDiff').innerText = diff.toLocaleString();
            document.getElementById('outCan').innerText = totalCan.toLocaleString();
            document.getElementById('outGift').innerText = giftNumDisplay;
            document.getElementById('outCash').innerText = '$' + cash.toLocaleString();
            
            document.getElementById('resBoard').style.display = 'block';
        }
    </script>
</body>
</html>
