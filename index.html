<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoodNight貴族爵位</title>
    <style>
        :root { 
            --gn-soft-pink: #ff85a1; /* 調降飽和度的柔粉色 */
            --gn-gold: #ffd700; 
            --bg-deep: #0f0f12; 
            --card-bg: rgba(28, 28, 33, 0.9);
            --border-soft: rgba(255, 133, 161, 0.2);
        }
        
        body { 
            font-family: -apple-system, "PingFang TC", sans-serif; 
            /* 背景改用極淡的粉色擴散感，避免全黑死板 */
            background: radial-gradient(circle at top right, #251418, #0f0f12); 
            color: #e0e0e6; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 460px; 
            padding: 40px 30px; 
            border-radius: 32px; 
            border: 1px solid var(--border-soft); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            position: relative;
        }

        h1 { 
            color: var(--gn-soft-pink);
            text-align: center; 
            font-size: 1.6rem; 
            margin-bottom: 35px; 
            font-weight: 800;
            letter-spacing: 1.5px;
        }
        
        label { color: #999; font-size: 0.8rem; font-weight: 600; margin-left: 5px; margin-bottom: 10px; display: block; }

        input, select { 
            width: 100%; padding: 16px; border-radius: 14px; 
            border: 1px solid #333; background: #000; 
            color: white; font-size: 1.1rem; box-sizing: border-box; 
            outline: none; transition: 0.3s;
        }

        input:focus { border-color: var(--gn-soft-pink); }

        .current-rank-tag { margin-top: 10px; font-size: 0.9rem; color: var(--gn-gold); font-weight: bold; padding: 5px 12px; background: rgba(255, 215, 0, 0.1); border-radius: 8px; display: inline-block; }

        .quick-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .btn-small { 
            background: #25252b; color: #aaa; border: 1px solid #333; 
            padding: 12px 0; border-radius: 10px; font-size: 0.85rem; 
            cursor: pointer; transition: 0.2s;
        }
        .btn-small:hover { border-color: var(--gn-soft-pink); color: #fff; }
        .btn-small.active { background: var(--gn-soft-pink); color: white; border: none; }
        .btn-wide { grid-column: span 2; }

        .btn-main { 
            width: 100%; background: var(--gn-soft-pink); 
            color: white; border: none; padding: 18px; border-radius: 50px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer; 
            margin-top: 25px; transition: 0.3s;
        }
        .btn-main:hover { filter: brightness(1.1); box-shadow: 0 10px 20px rgba(255, 133, 161, 0.2); }

        /* 結果面板 - 降低粉紅色強度 */
        .result-panel { 
            margin-top: 35px; border-radius: 24px; 
            background: rgba(255, 133, 161, 0.05); /* 改用極淡背景 */
            border: 1px dashed var(--border-soft); 
            display: none; 
            overflow: hidden;
        }
        .res-header { padding: 25px 20px; text-align: center; }
        .res-money { font-size: 3rem; font-weight: 800; color: var(--gn-gold); display: block; margin-top: 5px; }
        
        .details { padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .row { display: flex; justify-content: space-between; font-size: 0.95rem; color: #ccc; margin-bottom: 10px; }
        
        .strategy-box { background: rgba(255, 215, 0, 0.05); border-left: 3px solid var(--gn-gold); padding: 15px; margin-top: 30px; border-radius: 4px; font-size: 0.85rem; color: #999; }

        .note { font-size: 0.75rem; color: #555; margin-top: 40px; text-align: center; }
        .thanks { color: var(--gn-soft-pink); font-weight: bold; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; font-size: 0.8rem; }
    </style>
</head>
<body onload="updateRank()">

<div class="card">
    <h1>🎀GoodNight<br>貴族爵位</h1>

    <div class="input-group">
        <label>累積讚數 (主頁>貴族等級>左下黃色數字)</label>
        <input type="number" id="currZan" value="0" oninput="updateRank()" onclick="this.select()">
        <div id="rankDisplay" class="current-rank-tag">目前爵位：</div>
    </div>

    <div class="input-group">
        <label>目標爵位</label>
        <select id="targetRank">
            <option value="25500">劍客 (25,500)</option>
            <option value="175500">騎士 (175,500)</option>
            <option value="425500">伯爵 (425,500)</option>
            <option value="2425500">公爵 (2,425,500)</option>
            <option value="5000000">教皇 (5,000,000)</option>
            <option value="10000000">至尊 (10,000,000)</option>
            <option value="20000000" selected>神王 (20,000,000)</option>
        </select>
    </div>

    <div class="input-group">
        <label>加倍讚倍數</label>
        <input type="number" id="multi" value="30">
        <div class="quick-btn-grid">
            <button class="btn-small" onclick="setMulti(30)">30x</button>
            <button class="btn-small" onclick="setMulti(25)">25x</button>
            <button class="btn-small" onclick="setMulti(20)">20x</button>
            <button class="btn-small" onclick="setMulti(15)">15x</button>
            <button class="btn-small" onclick="setMulti(10)">10x</button>
            <button class="btn-small" onclick="setMulti(5)">5x</button>
            <button class="btn-small btn-wide" onclick="setMulti(1)">無加倍</button>
        </div>
    </div>

    <button class="btn-main" onclick="doCalc()">開始試算</button>

    <div id="resBoard" class="result-panel">
        <div class="res-header">
            <div style="font-size: 0.85rem; color: #888;">預計晉升成本</div>
            <span class="res-money" id="outCash">$0</span>
        </div>
        <div class="details">
            <div class="row"><span>尚差讚數</span><span id="outDiff" style="color:#fff;">0</span></div>
            <div class="row"><span>總需罐頭</span><span id="outCan" style="color:#fff;">0</span></div>
        </div>
    </div>

    <div class="strategy-box">
        <b>💡 不建議續等：</b> 掉下再升比原階續等划算。單數月 10-25 號綁定最優。<br>
        如神王需兩千萬讚，續等要 60% 換算為一千兩百萬讚，<br>掉到至尊只要一千萬上神王，
        所有爵位皆適用。<br>
    </div>

    <div class="note">
        基準：1 顆 9999 罐 = 27,497 讚<br>
        匯率：NT$1 ≈ 2 罐頭<br>
        我男朋友來了 | 2026.03.31<br>
        <div class="thanks">感謝 賈高賽 數據提供</div>
    </div>
</div>

<script>
    const ranks = [
        {name: "神王", val: 20000000}, {name: "至尊", val: 10000000},
        {name: "教皇", val: 5000000}, {name: "公爵", val: 2425500},
        {name: "伯爵", val: 425500}, {name: "騎士", val: 175500},
        {name: "劍客", val: 25500}, {name: "V4", val: 13000},
        {name: "V3", val: 5500}, {name: "V2", val: 1800},
        {name: "V1", val: 500}
    ];

    function setMulti(val) {
        document.getElementById('multi').value = val;
        if (document.getElementById('resBoard').style.display === 'block') { doCalc(); }
    }

    function getCurrentRankInfo(val) {
        for (let i = 0; i < ranks.length; i++) {
            if (val >= ranks[i].val) return ranks[i];
        }
        return {name: "V0", val: 0};
    }

    function updateRank() {
        const val = parseFloat(document.getElementById('currZan').value) || 0;
        const currentRank = getCurrentRankInfo(val);
        document.getElementById('rankDisplay').innerText = "目前爵位：" + currentRank.name;
    }

    function doCalc() {
        const curr = parseFloat(document.getElementById('currZan').value) || 0;
        const targetSelect = document.getElementById('targetRank');
        const targetVal = parseFloat(targetSelect.value);
        const multi = parseFloat(document.getElementById('multi').value) || 1;
        
        const zanPerGiftAtOne = 27497;
        const exchangeRate = 0.5;

        let diff = targetVal - curr;
        if (diff < 0) diff = 0;
        const giftNumExact = diff / (zanPerGiftAtOne * multi);
        const totalCan = Math.ceil(giftNumExact * 9999);
        const cash = Math.ceil(totalCan * exchangeRate);

        document.getElementById('outDiff').innerText = diff.toLocaleString();
        document.getElementById('outCan').innerText = totalCan.toLocaleString();
        document.getElementById('outCash').innerText = '$' + cash.toLocaleString();
        
        document.getElementById('resBoard').style.display = 'block';
    }
</script>

</body>
</html>
